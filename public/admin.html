<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Administration</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="site">
    <div class="container">
      <a class="logo" href="/"><span data-shop-name>Plata Plata</span> · Admin</a>
      <button class="btn secondary" id="logout" hidden>Déconnexion</button>
    </div>
  </header>

  <main class="container" style="padding:32px 16px 48px">
    <section class="panel" id="login" style="max-width:400px;margin:0 auto">
      <h2 style="margin-top:0">Connexion</h2>
      <form class="stack" id="login-form">
        <input type="password" id="password" placeholder="Mot de passe admin" required>
        <button class="btn">Entrer</button>
        <p class="error" id="login-error"></p>
      </form>
    </section>

    <div id="dashboard" hidden>
      <div class="stats">
        <div class="panel stat"><div class="value" id="revenue">—</div><div class="label">Chiffre d'affaires</div></div>
        <div class="panel stat"><div class="value" id="count">—</div><div class="label">Commandes</div></div>
        <div class="panel stat"><div class="value" id="avg">—</div><div class="label">Panier moyen</div></div>
      </div>

      <section class="panel" style="margin-bottom:24px">
        <h2 style="margin-top:0">Commandes</h2>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Date</th><th>Client</th><th>Articles</th><th>Livraison</th><th>Total</th></tr></thead>
            <tbody id="orders"></tbody>
          </table>
        </div>
      </section>

      <section class="panel" style="margin-bottom:24px">
        <h2 style="margin-top:0" id="form-title">Ajouter un produit</h2>
        <form class="stack" id="product-form">
          <input name="name" placeholder="Nom du produit" required>
          <textarea name="description" placeholder="Description" rows="3"></textarea>
          <input name="price" type="number" step="0.01" min="0.5" placeholder="Prix (ex: 29.90)" required>
          <input name="image" placeholder="URL de l'image (https://...)">
          <input name="category" placeholder="Catégorie">
          <input name="stock" type="number" min="0" placeholder="Stock (vide = illimité)">
          <div style="display:flex;gap:8px">
            <button class="btn" id="submit-product">Ajouter</button>
            <button class="btn secondary" type="button" id="cancel-edit" hidden>Annuler</button>
          </div>
          <p class="error" id="product-error"></p>
        </form>
      </section>

      <section class="panel">
        <h2 style="margin-top:0">Produits</h2>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Produit</th><th>Catégorie</th><th>Prix</th><th>Stock</th><th></th></tr></thead>
            <tbody id="products"></tbody>
          </table>
        </div>
      </section>
    </div>
  </main>

  <script src="/app.js"></script>
  <script>
    const PW_KEY = 'plata_admin_pw';
    let password = '';
    try { password = sessionStorage.getItem(PW_KEY) || ''; } catch {}
    let products = [];
    let editingId = null;

    async function api(path, options = {}) {
      const res = await fetch(path, {
        ...options,
        headers: { 'Content-Type': 'application/json', 'x-admin-password': password, ...(options.headers || {}) },
      });
      if (res.status === 204) return null;
      const data = await res.json();
      if (!res.ok) throw Object.assign(new Error(data.error), { status: res.status });
      return data;
    }

    async function load() {
      const data = await api('/api/admin/orders');
      document.getElementById('login').hidden = true;
      document.getElementById('dashboard').hidden = false;
      document.getElementById('logout').hidden = false;
      document.getElementById('revenue').textContent = Shop.money(data.revenue);
      document.getElementById('count').textContent = data.count;
      document.getElementById('avg').textContent = data.count ? Shop.money(Math.round(data.revenue / data.count)) : '—';
      document.getElementById('orders').innerHTML = data.orders.map((o) => {
        const addr = o.shipping?.address;
        return `<tr>
          <td>${new Date(o.createdAt).toLocaleString('fr-FR')}</td>
          <td>${Shop.escape(o.name || '')}<br><small>${Shop.escape(o.email || '')}</small></td>
          <td>${o.items.map((i) => `${i.quantity} × ${Shop.escape(i.name)}`).join('<br>')}</td>
          <td>${addr ? Shop.escape([addr.line1, addr.line2, addr.postal_code, addr.city, addr.country].filter(Boolean).join(', ')) : '—'}</td>
          <td><strong>${Shop.money(o.total)}</strong></td>
        </tr>`;
      }).join('') || '<tr><td colspan="5">Aucune commande pour l\'instant.</td></tr>';

      products = await fetch('/api/products').then((r) => r.json());
      document.getElementById('products').innerHTML = products.map((p) => `<tr>
        <td>${Shop.escape(p.name)}</td>
        <td>${Shop.escape(p.category)}</td>
        <td>${Shop.money(p.price)}</td>
        <td>${p.stock ?? '∞'}</td>
        <td style="white-space:nowrap">
          <button class="btn secondary" data-edit="${Shop.escape(p.id)}">Modifier</button>
          <button class="btn danger" data-del="${Shop.escape(p.id)}">Suppr.</button>
        </td>
      </tr>`).join('');
    }

    function resetForm() {
      editingId = null;
      document.getElementById('product-form').reset();
      document.getElementById('form-title').textContent = 'Ajouter un produit';
      document.getElementById('submit-product').textContent = 'Ajouter';
      document.getElementById('cancel-edit').hidden = true;
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      password = document.getElementById('password').value;
      try {
        await load();
        try { sessionStorage.setItem(PW_KEY, password); } catch {}
      } catch (err) {
        document.getElementById('login-error').textContent = err.message;
      }
    });

    document.getElementById('logout').addEventListener('click', () => {
      try { sessionStorage.removeItem(PW_KEY); } catch {}
      location.reload();
    });

    document.getElementById('product-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const body = JSON.stringify(Object.fromEntries(new FormData(e.target)));
      try {
        if (editingId) await api(`/api/admin/products/${editingId}`, { method: 'PUT', body });
        else await api('/api/admin/products', { method: 'POST', body });
        document.getElementById('product-error').textContent = '';
        resetForm();
        await load();
        Shop.toast('Produit enregistré ✓');
      } catch (err) {
        document.getElementById('product-error').textContent = err.message;
      }
    });

    document.getElementById('cancel-edit').addEventListener('click', resetForm);

    document.addEventListener('click', async (e) => {
      const edit = e.target.closest('[data-edit]');
      const del = e.target.closest('[data-del]');
      if (edit) {
        const p = products.find((x) => x.id === edit.dataset.edit);
        editingId = p.id;
        const form = document.getElementById('product-form');
        form.name.value = p.name;
        form.description.value = p.description || '';
        form.price.value = (p.price / 100).toFixed(2);
        form.image.value = p.image || '';
        form.category.value = p.category || '';
        form.stock.value = p.stock ?? '';
        document.getElementById('form-title').textContent = 'Modifier le produit';
        document.getElementById('submit-product').textContent = 'Enregistrer';
        document.getElementById('cancel-edit').hidden = false;
        form.scrollIntoView({ behavior: 'smooth' });
      }
      if (del && confirm('Supprimer ce produit ?')) {
        await api(`/api/admin/products/${del.dataset.del}`, { method: 'DELETE' });
        await load();
      }
    });

    Shop.init().then(() => { if (password) load().catch(() => {}); });
  </script>
</body>
</html>
